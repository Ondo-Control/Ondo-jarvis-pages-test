name: ONDO JARVIS Private CI Relay

on:
  workflow_dispatch:
    inputs:
      private_sha:
        description: "Exact 40-character commit SHA from Ondo-Control/ondo-jarvis"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".ci-trigger/ondo-jarvis-sha.txt"

permissions:
  contents: read

concurrency:
  group: ondo-jarvis-private-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefe:
    name: Projektpruefung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public relay repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve and validate requested private SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.private_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_SHA="$MANUAL_SHA"
          else
            TARGET_SHA="$(tr -d '[:space:]' < .ci-trigger/ondo-jarvis-sha.txt)"
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::private_sha must be an exact 40-character lowercase commit SHA"
            exit 2
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout private ONDO JARVIS commit
        uses: actions/checkout@v4
        with:
          repository: Ondo-Control/ondo-jarvis
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.ONDO_JARVIS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-ondo-jarvis

      - name: Verify checked-out commit
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Prepare private repository CI context
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git switch -C relay-target "$TARGET_SHA"
          git update-ref refs/remotes/origin/relay-target "$TARGET_SHA"
          test "$(git branch --show-current)" = "relay-target"
          test "$(git rev-parse origin/relay-target)" = "$TARGET_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: private-ondo-jarvis
        run: |
          python3 -m pip install -r requirements-test.txt

      - name: Ausfuehren von tools/pruefe.py
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          python3 -c 'import os, runpy; os.environ["GITHUB_SHA"] = os.environ["TARGET_SHA"]; runpy.run_path("tools/pruefe.py", run_name="__main__")'

  tests:
    name: Anwendungstests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pruefe
    if: always()
    steps:
      - name: Checkout public relay repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve and validate requested private SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.private_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_SHA="$MANUAL_SHA"
          else
            TARGET_SHA="$(tr -d '[:space:]' < .ci-trigger/ondo-jarvis-sha.txt)"
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::private_sha must be an exact 40-character lowercase commit SHA"
            exit 2
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout private ONDO JARVIS commit
        uses: actions/checkout@v4
        with:
          repository: Ondo-Control/ondo-jarvis
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.ONDO_JARVIS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-ondo-jarvis

      - name: Verify checked-out commit
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: private-ondo-jarvis
        run: |
          python3 -m pip install -r requirements-test.txt

      - name: Ausfuehren von pytest
        working-directory: private-ondo-jarvis
        run: |
          if [ -d "tests" ] && ls tests/test_*.py >/dev/null 2>&1; then
            python3 -m pytest -q
          else
            echo "Keine Anwendungstests vorhanden - überspringen"
          fi

  real_release_candidate:
    name: Offline-Paketbau (echtes npm, kein Artefakt-Upload)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pruefe, tests]
    steps:
      - name: Checkout public SHA trigger only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve exact private commit
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.private_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_SHA="$MANUAL_SHA"
          else
            TARGET_SHA="$(tr -d '[:space:]' < .ci-trigger/ondo-jarvis-sha.txt)"
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid pinned private SHA"
            exit 2
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source without persisting token
        uses: actions/checkout@v4
        with:
          repository: Ondo-Control/ondo-jarvis
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.ONDO_JARVIS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-ondo-jarvis

      - name: Verify exact source SHA
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Node and Python (no deployment)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install real npm dependencies and generate real lockfile
        working-directory: private-ondo-jarvis/alexa-hosted-skill/lambda
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npm ls --omit=dev --depth=0
          node -e "const m=require('./index.js'); if(typeof m.handler!=='function') process.exit(1); console.log('REAL_ALEXA_HANDLER_MODULE_LOAD_PASS')"

      - name: Verify actual pinned Alexa/Cloudflare V3 release in memory
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          python3 tools/verify_real_relay_v3_rc.py --source-sha "$TARGET_SHA"
          python3 tools/build_jarvis_aggregate_rc.py --source-sha "$TARGET_SHA"
          echo "REAL_NPM_COMBINED_RC_PASS_NO_ARTIFACT_UPLOAD"
        # Deliberately NEVER call actions/upload-artifact: the workflow repository
        # is PUBLIC while the checked-out ONDO JARVIS source is PRIVATE.
        # The CI output exposes only SHA/counts, not the archive, source or secrets.


  sealed_private_export:
    name: Verschluesselter In-Memory-Export (kein Public-Artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pruefe, tests, real_release_candidate]
    if: github.event_name == 'push'
    steps:
      - name: Checkout public pinned-SHA trigger
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve exact private SHA
        id: target
        run: |
          TARGET_SHA="$(tr -d '[:space:]' < .ci-trigger/ondo-jarvis-sha.txt)"
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then exit 2; fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout private commit READ-ONLY
        uses: actions/checkout@v4
        with:
          repository: Ondo-Control/ondo-jarvis
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.ONDO_JARVIS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-ondo-jarvis
      - name: Verify exact Git checkout
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real npm installation without hooks
        working-directory: private-ondo-jarvis/alexa-hosted-skill/lambda
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          npm ls --omit=dev --depth=0
      - name: Emit ONLY RSA-sealed and ChaCha20-encrypted archive (no secret, no plaintext)
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          ONDO_EPHEMERAL_RSA_PUBLIC_DER: ""
        run: |
          python3 - <<'PY'
          import base64,hashlib,os,subprocess,tempfile,textwrap
          from pathlib import Path
          import sys
          sys.path.insert(0,"tools")
          from build_jarvis_aggregate_rc import build
          sha=os.environ["TARGET_SHA"]
          archive,manifest=build(Path.cwd(),sha)
          assert manifest["source_commit"]==sha and manifest["deployment_performed"] is False
          assert manifest["release_approved"] is False
          with tempfile.TemporaryDirectory(prefix="ondo-sealed-") as folder:
              root=Path(folder)
              plain=root/"private-rc.zip"
              plain.write_bytes(archive)
              pub=root/"public.der"
              pub.write_bytes(base64.b64decode(os.environ["ONDO_EPHEMERAL_RSA_PUBLIC_DER"]))
              key=os.urandom(32)
              iv=os.urandom(16)
              keyfile=root/"session.key"
              keyfile.write_bytes(key)
              encrypted=root/"encrypted.bin"
              wrapped=root/"wrapped.bin"
              subprocess.run(["openssl","enc","-chacha20","-K",key.hex(),"-iv",iv.hex(),"-in",str(plain),"-out",str(encrypted)],check=True,stdout=subprocess.DEVNULL)
              subprocess.run(["openssl","pkeyutl","-encrypt","-pubin","-keyform","DER","-inkey",str(pub),"-pkeyopt","rsa_padding_mode:pkcs1","-in",str(keyfile),"-out",str(wrapped)],check=True,stdout=subprocess.DEVNULL)
              ciphertext=encrypted.read_bytes()
              assert len(ciphertext)==len(archive)
              print("ONDO_SEALED_PACKAGE_BEGIN",flush=True)
              print("ONDO_SEALED_SHA256="+hashlib.sha256(archive).hexdigest(),flush=True)
              print("ONDO_SEALED_SOURCE="+sha,flush=True)
              print("ONDO_SEALED_BYTES="+str(len(archive)),flush=True)
              print("ONDO_SEALED_IV="+iv.hex(),flush=True)
              print("ONDO_SEALED_RSA_KEY="+base64.b64encode(wrapped.read_bytes()).decode(),flush=True)
              for part in textwrap.wrap(base64.b64encode(ciphertext).decode(),100):
                  print("ONDO_SEALED_DATA="+part,flush=True)
              print("ONDO_SEALED_PACKAGE_END",flush=True)
          PY
        # Ciphertext only, with 2048-bit RSA sealed ephemeral stream key.
        # No public artifact upload or plaintext package anywhere on GitHub.
