name: ONDO JARVIS Private CI Relay

on:
  workflow_dispatch:
    inputs:
      private_sha:
        description: "Exact 40-character commit SHA from Ondo-Control/ondo-jarvis"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".ci-trigger/ondo-jarvis-sha.txt"

permissions:
  contents: read

concurrency:
  group: ondo-jarvis-private-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefe:
    name: Projektpruefung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public relay repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve and validate requested private SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.private_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_SHA="$MANUAL_SHA"
          else
            TARGET_SHA="$(tr -d '[:space:]' < .ci-trigger/ondo-jarvis-sha.txt)"
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::private_sha must be an exact 40-character lowercase commit SHA"
            exit 2
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout private ONDO JARVIS commit
        uses: actions/checkout@v4
        with:
          repository: Ondo-Control/ondo-jarvis
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.ONDO_JARVIS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: private-ondo-jarvis

      - name: Verify checked-out commit
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Prepare private repository CI context
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git switch -C relay-target "$TARGET_SHA"
          git update-ref refs/remotes/origin/relay-target "$TARGET_SHA"
          test "$(git branch --show-current)" = "relay-target"
          test "$(git rev-parse origin/relay-target)" = "$TARGET_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: private-ondo-jarvis
        run: |
          python3 -m pip install -r requirements-test.txt

      - name: Ausfuehren von tools/pruefe.py
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          python3 -c 'import os, runpy; os.environ["GITHUB_SHA"] = os.environ["TARGET_SHA"]; runpy.run_path("tools/pruefe.py", run_name="__main__")'

  tests:
    name: Anwendungstests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pruefe
    if: always()
    steps:
      - name: Checkout public relay repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve and validate requested private SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SHA: ${{ inputs.private_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET_SHA="$MANUAL_SHA"
          else
            TARGET_SHA="$(tr -d '[:space:]' < .ci-trigger/ondo-jarvis-sha.txt)"
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::private_sha must be an exact 40-character lowercase commit SHA"
            exit 2
          fi
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout private ONDO JARVIS commit
        uses: actions/checkout@v4
        with:
          repository: Ondo-Control/ondo-jarvis
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.ONDO_JARVIS_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-ondo-jarvis

      - name: Verify checked-out commit
        working-directory: private-ondo-jarvis
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: private-ondo-jarvis
        run: |
          python3 -m pip install -r requirements-test.txt

      - name: Ausfuehren von pytest
        working-directory: private-ondo-jarvis
        run: |
          if [ -d "tests" ] && ls tests/test_*.py >/dev/null 2>&1; then
            python3 -m pytest -q
          else
            echo "Keine Anwendungstests vorhanden - überspringen"
          fi
